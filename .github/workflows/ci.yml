name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: ormaos-python
    steps:
      - uses: actions/checkout@v4
        with:
          path: ormaos-python
      # The demo app, checked out next to this repository.
      - uses: actions/checkout@v4
        with:
          repository: ormaos/ormaos-examples
          path: ormaos-examples
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: ormaos-python/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy --strict src
      - name: Tests
        run: uv run pytest
        env:
          ORMAOS_DEMO_REQUIRED: "1"
      # The way a user installs it: a built package of this checkout (not a
      # published one) inside the environment of the demo app.
      - name: Install this checkout into the demo's environment
        run: |
          uv venv ../ormaos-examples/order-sync/.venv
          uv pip install --python ../ormaos-examples/order-sync/.venv/bin/python .
      - name: Demo tests with the demo's environment
        run: uv run pytest tests/test_demo.py
        env:
          ORMAOS_DEMO_REQUIRED: "1"
          ORMAOS_DEMO_PYTHON: ${{ github.workspace }}/ormaos-examples/order-sync/.venv/bin/python

  # One small example per library, each recorded and checked against
  # docs/compatibility.md. The libraries are in the `compat` dependency group.
  compat:
    name: Compatibility matrix (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install with the libraries of the matrix
        run: uv sync --locked --group compat
      - name: Run every row
        run: uv run --group compat pytest tests/compat -v
        env:
          ORMAOS_COMPAT_REQUIRED: "1"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
