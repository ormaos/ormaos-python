[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ormaos"
dynamic = ["version"]
description = "Records what happened inside a Python execution and hands it to the developer and to their coding agent."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Levi Braga" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
ormaos = "ormaos.cli:main"

[project.urls]
Repository = "https://github.com/ormaos/ormaos-python"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "requests>=2.31",
    "httpx>=0.27",
]
# The libraries of the compatibility matrix (tests/compat). Not needed to
# develop or to run the other tests.
compat = [
    "pytest>=8",
    "httpx>=0.27",
    "flask>=3",
    "fastapi>=0.115",
    "django>=5",
    "click>=8",
    "pandas>=2.2",
    "coverage>=7.6",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[tool.hatch.version]
path = "src/ormaos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ormaos"]

# The .pth file starts the recorder in Python processes that have ORMAOS_DIR set.
[tool.hatch.build.targets.wheel.force-include]
"ormaos.pth" = "ormaos.pth"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "ormaos.pth", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# SIM105: the recorder avoids importing contextlib at interpreter start.
ignore = ["SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["ormaos", "conftest"]

[tool.mypy]
strict = true
files = ["src"]
warn_unreachable = true
